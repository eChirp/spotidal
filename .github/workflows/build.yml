name: Build and Release Executable

on:
  push:
    tags:
      - 'v*' # Startet den Build automatisch, wenn ein Tag wie "v1.0.0" gepushed wird
  workflow_dispatch: # Erlaubt manuelles Ausführen im GitHub-Actions-Tab

jobs:
  build:
    name: Build Executable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: SpotifyToTidalConverter.exe
            asset_name: SpotifyToTidalConverter-Windows.exe
          # Optional: macOS oder Linux hinzufügen, falls gewünscht
          # - os: ubuntu-latest
          #   artifact_name: SpotifyToTidalConverter
          #   asset_name: SpotifyToTidalConverter-Linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install spotipy tidalapi pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller converter.spec

      - name: Upload Artifact (für spätere Downloads im Workflow)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

      - name: Create Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
